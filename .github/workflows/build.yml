name: Build APK

on:
  push:
    branches: [ main ]  # Сборка будет запускаться при каждом пуше в ветку main
  workflow_dispatch:     # Добавляет кнопку ручного запуска в интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем исходный код вашего репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем кэширование, чтобы сборка не длилась вечно при каждом запуске
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Cache Buildozer local directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      # 3. Запускаем компиляцию при помощи экшена ArtemSBulgakov
      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable

      # 4. Сохраняем готовый APK-файл как артефакт сборки
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.buildozer.outputs.filename }}
